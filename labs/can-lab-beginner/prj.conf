#
# Baseline config - already enabled for you. You do not need to edit
# anything above the TODO line.

CONFIG_GPIO=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Give the CAN/ADC/PWM init and soft-PWM thread a little more stack margin.
CONFIG_MAIN_STACK_SIZE=2048

# CAN is already enabled here (not a touchpoint): the board's devicetree
# already turns the CAN controller on by default, and CAN is what makes the
# two boards talk to each other at all, so it's part of the working
# baseline you build on - not something you need to discover.
#
# Note that this skeleton will NOT build until you have completed Step 1
# (the devicetree overlay) and Step 2 (below). That is deliberate - you'll
# get a clear #error telling you which step is outstanding. To check your
# board, wiring and toolchain before you start, flash the pre-built
# reference binary your instructor provides.
CONFIG_CAN=y

# The onboard TLE9251V CAN transceiver's standby pin (P7.6) is modelled as a
# can-transceiver-gpio node in the board overlay. The Infineon GPIO driver
# initialises at CONFIG_KERNEL_INIT_PRIORITY_DEVICE (50) rather than the usual
# CONFIG_GPIO_INIT_PRIORITY (40), so the transceiver's default priority of 45
# would run before its own GPIO port is ready. Move it after the GPIO driver
# but still before the CAN controller (CONFIG_CAN_INIT_PRIORITY=80).
CONFIG_CAN_TRANSCEIVER_INIT_PRIORITY=55

