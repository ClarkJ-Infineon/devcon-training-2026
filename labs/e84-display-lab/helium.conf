# Helium (Armv8.1-M MVE) software rendering, applied on top of prj.conf.
#
#   west build -b kit_pse84_eval/pse846gps2dbzc4a/m55 -p always --sysbuild \
#       -DEXTRA_CONF_FILE=helium.conf
#
# Requires the LVGL patches in zephyr/patches/ - without patches 0001 and
# 0002 the Helium assembly sources fail to compile.

# -O2 rather than -Os. The rendering loop is the hot path and the image is
# well inside the available flash.
CONFIG_SPEED_OPTIMIZATIONS=y

# Two frame buffers. With a single buffer LVGL renders into the buffer the
# display controller is scanning out, so partially drawn frames reach the
# panel and appear as flashes during animation.
CONFIG_LV_Z_DOUBLE_VDB=y

# Match the draw buffers to the cache line so that blend loops operate on
# aligned words and the stride carries no padding.
CONFIG_LV_Z_VDB_ALIGN=64
CONFIG_LV_ATTRIBUTE_MEM_ALIGN_SIZE=64
CONFIG_LV_DRAW_BUF_ALIGN=64

# Select the MVE assembly blend kernels. Both symbols are required: the first
# selects the Helium backend, the second selects its hand-written assembly
# implementation over the C intrinsics path.
CONFIG_LV_DRAW_SW_ASM_HELIUM=y
CONFIG_LV_USE_NATIVE_HELIUM_ASM=y