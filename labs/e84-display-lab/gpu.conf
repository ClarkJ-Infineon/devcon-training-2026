# GCNanoUltraV GPU-accelerated rendering, applied on top of prj.conf.
# Supersedes helium.conf.
#
#   west build -b kit_pse84_eval/pse846gps2dbzc4a/m55 -p always --sysbuild \
#       -DEXTRA_CONF_FILE=gpu.conf -DEXTRA_DTC_OVERLAY_FILE=gpu.overlay
#
# Both the config and the overlay are required - the overlay binds the GPU
# node and enlarges GFX_MEMORY for the vg_lite heap.
#
# Requires all three LVGL patches in zephyr/patches/.

CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_LV_Z_DOUBLE_VDB=y

CONFIG_LV_Z_VDB_ALIGN=64
CONFIG_LV_ATTRIBUTE_MEM_ALIGN_SIZE=64
CONFIG_LV_DRAW_BUF_ALIGN=64

# Helium (Armv8.1-M MVE) assembly blend kernels, for everything the GPU
# declines to draw.
CONFIG_LV_DRAW_SW_ASM_HELIUM=y
CONFIG_LV_USE_NATIVE_HELIUM_ASM=y

# Route LVGL drawing through the GCNanoUltraV via the vg_lite driver.
CONFIG_LV_USE_DRAW_VG_LITE=y
CONFIG_LV_USE_VG_LITE_DRIVER=y
CONFIG_LV_USE_VECTOR_GRAPHIC=y
CONFIG_LV_Z_VGLITE_HEAP_SIZE=786432
CONFIG_LV_Z_MEM_POOL_SIZE=524288

# The GPU pool is far too large for the M55 system RAM region, and the GPU
# has to be able to DMA out of it, so place it in GFX_MEMORY alongside the
# draw buffers. The baseline configuration leaves the much smaller default
# pool in system RAM.
CONFIG_LV_Z_MEMORY_POOL_ZEPHYR_REGION=y
CONFIG_LV_Z_MEMORY_POOL_ZEPHYR_REGION_NAME="GFX_MEMORY"
# vg_lite allocates a ~166 KB tessellation buffer. The small-only sys_heap
# format cannot serve a block of that size from this heap.
CONFIG_SYS_HEAP_AUTO=y

# The GCNanoUltraV rejects pattern blits whose source stride is not aligned
# to the bus width.
CONFIG_LV_DRAW_BUF_STRIDE_ALIGN=64

# The GPU cannot read image data from XIP QSPI flash. Caching decoded images
# in the LVGL pool places them in GPU-accessible SOCMEM.
CONFIG_LV_CACHE_DEF_SIZE=262144
CONFIG_LV_IMAGE_HEADER_CACHE_DEF_CNT=16