#
# Fallback on-board LED drive path: bit-bang LED3 (P8.4, alias led0) from a
# dedicated software thread instead of routing the real TCPWM line to it
# through the PERI trigger mux.
#
# Do not pass this file by hand - build with -DLED_SOFTPWM=y and the
# application's CMakeLists.txt selects it (and skips
# boards/led_trigmux.overlay) automatically:
#
#   west build -b kit_psc3m6_evk -d build/lab -s <path-to-this-dir> -- \
#       -DEXTRA_CONF_FILE=conf/role_command.conf -DLED_SOFTPWM=y

CONFIG_LAB_LED_TRIGMUX=n
