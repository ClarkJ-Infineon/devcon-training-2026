# West manifest for the DevCon 2026 FAE training event.
#
# Bundles the lab applications (PSOC Control CAN lab, PSOC Edge E84 display
# lab and dashboard lab) and pins a trimmed project list against a mainline-based Zephyr
# branch, rather than importing upstream Zephyr's full west.yml. The list
# below contains only the modules the training requires; upstream's manifest
# would additionally fetch every other vendor HAL and babblesim.
#
# The final four projects (mcuboot, trusted-firmware-m, mbedtls,
# tf-psa-crypto) are not used by any lab. They are present so that the
# PSOC Edge advanced session, which covers multi-core, TF-M and MCUboot,
# can build without a second download on the day. Upstream's tee and
# crypto groups also carry tf-psa-crypto-drivers, mldsa-native, tf-m-tests
# and psa-arch-tests; none are needed and all are omitted.
#
# zephyr is pinned by commit SHA rather than branch name, so a given commit
# of this manifest always resolves to one exact Zephyr tree.
#
# Every project sets clone-depth: 1. Combined with `west update --narrow`,
# each repository is fetched at the single pinned commit with no history,
# which is what the labs build against. Full history for any project can be
# recovered later with `git fetch --unshallow` inside that project.

manifest:
  remotes:
    - name: clarkj-infineon
      url-base: https://github.com/ClarkJ-Infineon
    - name: upstream
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: clarkj-infineon
      repo-path: zephyr
      revision: 958bd19285da6672c846dbfc948c6670078afac1
      west-commands: scripts/west-commands.yml
      clone-depth: 1

    - name: hal_infineon
      remote: upstream
      revision: 2191db4d7723737ffd3d59d01b50f7595dac2944
      path: modules/hal/infineon
      clone-depth: 1
      groups:
        - hal

    - name: cmsis
      remote: upstream
      revision: 512cc7e895e8491696b61f7ba8066b4a182569b8
      path: modules/hal/cmsis
      clone-depth: 1
      groups:
        - hal

    - name: cmsis_6
      remote: upstream
      repo-path: CMSIS_6
      revision: 1c1840af7a7e757d6e2fec3ddb0e5ce0dfcc93c8
      path: modules/hal/cmsis_6
      clone-depth: 1
      groups:
        - hal

    - name: lvgl
      remote: upstream
      revision: d1fe35d350a1503db2ec7fd4dfff8e0cc26eea7e
      path: modules/lib/gui/lvgl
      clone-depth: 1

    - name: mcuboot
      remote: upstream
      repo-path: mcuboot
      revision: c85af35b875d244cf91f8ec3caa04168fc7f1ec1
      path: bootloader/mcuboot
      clone-depth: 1

    - name: trusted-firmware-m
      remote: upstream
      repo-path: trusted-firmware-m
      revision: b01f190e46afcb02b7f240d2b3ab961d6bca6c24
      path: modules/tee/tf-m/trusted-firmware-m
      clone-depth: 1

    - name: mbedtls
      remote: upstream
      repo-path: mbedtls
      revision: c43f34b93797e81fd0257c30004dcd0ae332ae51
      path: modules/crypto/mbedtls
      clone-depth: 1

    - name: tf-psa-crypto
      remote: upstream
      repo-path: tf-psa-crypto
      revision: 765af96a20a2b408474dcd950372ba9af4d26b62
      path: modules/crypto/tf-psa-crypto
      clone-depth: 1
  self:
    path: devcon-training-2026
