# PSOC Edge E84 display smoke-test / LVGL demo - DevCon 2026 training branch.
#
# The infineon_dc display driver only supports whole-frame flushes (it swaps
# the entire frame buffer pointer rather than copying partial rects), so LVGL
# must be forced into full-refresh rendering mode - CONFIG_LV_Z_FULL_REFRESH
# below, not the Zephyr LVGL default (partial refresh). See
# modules/lvgl/Kconfig.memory for the choice and modules/lvgl/lvgl.c for how
# it maps to LV_DISPLAY_RENDER_MODE_FULL.
#
# Color depth is set to match the display_controller's input-pixel-format
# (PANEL_PIXEL_FORMAT_RGB_565) in the board overlay, avoiding an implicit
# LVGL-side conversion on every flush.
#
# A full-frame RGB565 buffer at 832x480 is ~781 KB, which does not fit in
# the M55 core's system RAM region. Placing it in the "GFX_MEMORY"
# zephyr,memory-region (the gfx_mem node the board overlay adds in SOCMEM)
# avoids the RAM overflow and matches what the DC hardware expects to read
# the framebuffer from anyway.

CONFIG_LV_Z_VDB_ZEPHYR_REGION=y
CONFIG_LV_Z_VDB_ZEPHYR_REGION_NAME="GFX_MEMORY"

# Two rendering buffers, not one. ifx_dc_write() does not copy pixels - it
# points the display controller straight at the buffer LVGL hands it
# (Cy_GFXSS_Set_FrameBuffer). With a single buffer that is the same memory the
# panel is actively scanning out, so LVGL's next full redraw repaints the
# screen underneath the scan and every element flickers once per update, even
# ones whose content did not change. Double buffering lets LVGL render into the
# idle buffer and the driver swap the pointer on flush, which is the model this
# hardware is built around. Costs a second 832x480x2 = 780 KB buffer, taking
# GFX_MEMORY to about 76% of its 2 MB.
CONFIG_LV_Z_DOUBLE_VDB=y

CONFIG_DISPLAY=y
CONFIG_DISPLAY_LOG_LEVEL_ERR=y

CONFIG_LOG=y
# Immediate mode so the build-stamp banner (see src/main.c) can never be lost
# to a deferred log ring buffer that doesn't get serviced if something early
# in the display init path hangs.
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_LVGL=y
CONFIG_LV_Z_FULL_REFRESH=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_LV_USE_LOG=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_14=y

CONFIG_MAIN_STACK_SIZE=4096
