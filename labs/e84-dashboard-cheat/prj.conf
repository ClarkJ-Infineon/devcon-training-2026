# DevCon 2026 PSOC Edge lab - Device Dashboard, cheat tier.
#
# The display half of this file is inherited wholesale from the proven
# e84-display-lab smoke test; the comments there explain *why* each symbol is
# needed and are kept verbatim because attendees read this file during
# touchpoint 2.

# --- Display plumbing (proven) --------------------------------------------
#
# The infineon_dc display driver only supports whole-frame flushes (it swaps
# the entire frame buffer pointer rather than copying partial rects), so LVGL
# must be forced into full-refresh rendering mode.
#
# A full-frame RGB565 buffer at 832x480 is ~781 KB, which does not fit in the
# M55 core's system RAM region. Placing it in the "GFX_MEMORY"
# zephyr,memory-region (the gfx_mem node the board overlay adds in SOCMEM)
# avoids the RAM overflow and matches what the DC hardware expects to read the
# framebuffer from anyway.
CONFIG_LV_Z_VDB_ZEPHYR_REGION=y
CONFIG_LV_Z_VDB_ZEPHYR_REGION_NAME="GFX_MEMORY"

# Two rendering buffers, not one. ifx_dc_write() does not copy pixels - it
# points the display controller straight at the buffer LVGL hands it. With a
# single buffer that is the same memory the panel is actively scanning out, so
# every element flickers once per update. Mandatory with full refresh.
CONFIG_LV_Z_DOUBLE_VDB=y

CONFIG_DISPLAY=y
CONFIG_DISPLAY_LOG_LEVEL_ERR=y

CONFIG_LVGL=y
CONFIG_LV_Z_FULL_REFRESH=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_USE_LOG=y

# --- Touch input ----------------------------------------------------------
#
# The FocalTech controller is already described in the board DTS on i2c0; all
# that is needed here is to build the driver and the input subsystem that
# carries its events into LVGL's indev layer.
CONFIG_INPUT=y
CONFIG_INPUT_FT5336=y

# The touch node declares no "int-gpios", so INPUT_FT5336_INTERRUPT defaults
# to n and the driver polls on the system workqueue every 10 ms. Because
# input_report() refuses to block when called from syswq, a full queue drops
# events rather than waiting - silently, apart from a warning.
#
# Each sample reports three events (X, Y, BTN_TOUCH), so the default 16-deep
# queue holds only ~53 ms of touch. A full-screen repaint takes ~47 ms of
# uninterrupted CPU, and the input thread defaults to preemptible priority 0 -
# the same as main - so it cannot preempt the repaint to drain the queue.
# Every repaint therefore sat on the edge of overflowing it, and dragging a
# slider (which legitimately repaints continuously) pushed it over: the log
# filled with "Event dropped, queue full" and presses went missing.
#
# Two independent changes, because queue depth alone is a guess that has to
# track repaint duration:
#   - a deeper queue absorbs the burst (64 x 3 events = ~213 ms of touch)
#   - the input thread keeps its default preemptible priority. Raising it to
#     a cooperative priority also works and drains with lower latency, but a
#     cooperative thread is never preempted, so any slow callback - a stray
#     LOG_INF over a 115200 UART in immediate mode is enough - starves the
#     main thread that LVGL runs on. That is a sharp edge to leave in a lab
#     exercise, and the deeper queue alone covers the burst.
CONFIG_INPUT_QUEUE_MAX_MSGS=64

# The touch controller and the BMI270 share i2c0, and the bus throws an
# occasional error event under load. Recovering from one is expensive: the
# SCB interrupt handler busy-waits up to 10 ms for the block to go idle and
# then logs, which in immediate log mode blocks the UART for several more
# milliseconds - all with the interrupt still being serviced. A burst of
# those during a drag pushed lv_timer_handler from 47 ms to over 200 ms.
#
# Polling at 50 Hz instead of 100 Hz halves the transactions on the bus and
# so roughly halves the number of error events, while staying comfortably
# above the ~21 fps the display can actually repaint at. Note the symbol is
# INPUT_FT5336_PERIOD_MS - the driver has no CONFIG_INPUT_FT5336_PERIOD, and
# a .conf setting that name is accepted silently and does nothing.
CONFIG_INPUT_FT5336_PERIOD_MS=20

# --- LED PWM --------------------------------------------------------------
#
# See the board overlay for the devicetree side. Without CONFIG_PWM the
# PWM_DT_SPEC_GET() calls in src/main.c compile but resolve to a driver API
# that was never built.
CONFIG_PWM=y

# --- IMU ------------------------------------------------------------------
#
# bmi270 is on i2c0 at 0x68 with the accel0 alias, declared by the board.
CONFIG_SENSOR=y
CONFIG_BMI270=y

# --- Local module ---------------------------------------------------------
#
# modules/tilt_filter is pulled in by ZEPHYR_EXTRA_MODULES in CMakeLists.txt,
# but a module only contributes code when its own Kconfig symbol is set. This
# line is the switch. Set it to n and the build still succeeds - the tilt
# readout just becomes visibly jittery.
CONFIG_TILT_FILTER=y
CONFIG_TILT_FILTER_ALPHA_PERCENT=18

# --- Audio feedback -------------------------------------------------------
#
# The second local module, modules/beeper, plays a short tone through the
# board's TLV320DAC3100 and onboard speaker when a slider is released. It
# needs three subsystems underneath it:
#
#   I2S          carries the samples to the codec
#   AUDIO_CODEC  configures and routes the codec over i2c0 (it has no data
#                path of its own - see the comment at the top of beeper.c)
#   DMA          the I2S transmitter is fed by dma0 channel 1
#
# The codec, i2s0 and the clock divider that produces its 12.288 MHz MCLK
# are all described in the board overlay.
CONFIG_I2S=y
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y
CONFIG_DMA=y

CONFIG_BEEPER=y

# --- LVGL widgets and fonts used by the UI --------------------------------
#
# Each widget family is an independent Kconfig symbol so unused ones cost no
# flash. The dashboard uses sliders (which are built on bars), an arc for the
# tilt meter, and labels throughout.
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_SLIDER=y
CONFIG_LV_USE_ARC=y

CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_18=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_MONTSERRAT_40=y

# Rounded corners, gradients and the arc's anti-aliased stroke all allocate
# from LVGL's own heap rather than the Zephyr heap. The smoke test's 16 KB is
# not enough once there are a dozen styled objects on screen.
CONFIG_LV_Z_MEM_POOL_SIZE=49152

# --- Diagnostics ----------------------------------------------------------
CONFIG_LOG=y
# Immediate mode so the build-stamp banner (see src/main.c) can never be lost
# to a deferred log ring buffer that doesn't get serviced if something early
# in the display init path hangs.
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_MAIN_STACK_SIZE=8192
