# SPDX-License-Identifier: Apache-2.0
#
# "Option A" on-board LED drive path: real TCPWM hardware PWM routed to
# LED0 (P8.5) through the PERI trigger mux, instead of the default
# software-timed bit-bang.
#
# Do not pass this file by hand - build with -DLED_TRIGMUX=y and the
# application's CMakeLists.txt adds it (and boards/led_trigmux.overlay)
# automatically:
#
#   west build -b kit_psc3m5_evk -p always -- \
#       -DEXTRA_CONF_FILE=conf/role_command.conf -DLED_TRIGMUX=y

CONFIG_LAB_LED_TRIGMUX=y
